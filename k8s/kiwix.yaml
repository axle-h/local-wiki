# Offline library served by kiwix-serve: LAN via NodePort 30088, public at https://wiki.ax-h.com.
# Apply: kubectl apply -f kiwix.yaml -f zim-library.yaml
# zim-library.yaml's Job downloads the ZIMs and registers them in
# /data/library.xml; kiwix-serve watches that file and picks up new content live.
apiVersion: v1
kind: Namespace
metadata:
  name: wiki
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zim
  namespace: wiki
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 200Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiwix
  namespace: wiki
  labels:
    app: kiwix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kiwix
  template:
    metadata:
      labels:
        app: kiwix
    spec:
      initContainers:
        - name: wait-for-library
          image: busybox:1.37
          command: ["/bin/sh", "-c", 'until [ -f /data/library.xml ]; do echo "waiting for library.xml"; sleep 30; done']
          volumeMounts:
            - name: zim
              mountPath: /data
      containers:
        - name: kiwix-serve
          image: ghcr.io/kiwix/kiwix-serve:3.8.2
          # start.sh appends these args to kiwix-serve --port=8080
          args: ["--monitorLibrary", "--library", "/data/library.xml"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 3Gi
          volumeMounts:
            - name: zim
              mountPath: /data
              readOnly: true
      volumes:
        - name: zim
          persistentVolumeClaim:
            claimName: zim
---
apiVersion: v1
kind: Service
metadata:
  name: kiwix
  namespace: wiki
  labels:
    app: kiwix
spec:
  type: NodePort
  selector:
    app: kiwix
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30088
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-http-https
  namespace: wiki
spec:
  redirectScheme:
    permanent: true
    scheme: https
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kiwix
  namespace: wiki
  labels:
    app: kiwix
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.middlewares: wiki-redirect-http-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: wiki.ax-h.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kiwix
                port:
                  name: http
  tls:
    - hosts:
        - wiki.ax-h.com
      secretName: wiki-axh-com-tls
